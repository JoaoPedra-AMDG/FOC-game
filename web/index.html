<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FOC FAST: a quick, hands-on game about field-oriented motor control.">
  <meta name="theme-color" content="#262643">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; background: #262643; }
    body { touch-action: none; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FOC FAST">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.png" type="image/png">

  <title>FOC FAST · Field Control Game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    const buildVersion = {{flutter_service_worker_version}};
    const bootstrap = document.createElement('script');
    bootstrap.src = `flutter_bootstrap.js?v=${buildVersion}`;
    bootstrap.async = true;
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
